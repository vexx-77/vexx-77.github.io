  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #08090a;
      --card-bg: rgba(255, 255, 255, 0.035);
      --border-color: rgba(255, 255, 255, 0.09);
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --accent: #8a2be2;
      --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html { height: 100%; }
    
    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      touch-action: manipulation;
      overflow: hidden; /* Запрет скролла во время падения кнопок */
    }

    /* ---------- Фон ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: #050607; overflow: hidden; }
    .blob {
      position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
      filter: blur(90px); opacity: .35; will-change: transform;
      transform: translate3d(calc(var(--px, 0) * var(--k)), calc(var(--py, 0) * var(--k)), 0);
    }
    .blob.b1 { --k: 30px; background: radial-gradient(circle, #8a2be2, transparent 65%); top: -20vmax; left: -15vmax; animation: drift1 18s ease-in-out infinite alternate; }
    .blob.b2 { --k: -40px; background: radial-gradient(circle, #229ED9, transparent 65%); bottom: -25vmax; right: -15vmax; opacity: .25; animation: drift2 22s ease-in-out infinite alternate; }
    .blob.b3 { --k: 20px; background: radial-gradient(circle, #5865F2, transparent 65%); top: 30%; left: 40%; width: 35vmax; height: 35vmax; opacity: .15; animation: drift1 26s ease-in-out infinite alternate-reverse; }
    @keyframes drift1 { to { margin: 8vmax 0 0 10vmax; } }
    @keyframes drift2 { to { margin: -10vmax 8vmax 0 0; } }

    #particles { position: absolute; inset: 0; width: 100%; height: 100%; }
    .grid {
      position: absolute; inset: 0;
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.025) 1px, transparent 1px);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    }
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6)); }

    /* ---------- Контент ---------- */
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 1; }

    .avatar-anim, .title, .link-btn, .subtitle { animation: fadeInUp .9s var(--spring) backwards; }
    .avatar-anim { animation-delay: .05s; margin-bottom: 18px; perspective: 600px; }
    .title { animation-delay: .15s; }
    .link-btn:nth-child(1) { animation-delay: .28s; }
    .link-btn:nth-child(2) { animation-delay: .36s; }
    .link-btn:nth-child(3) { animation-delay: .44s; }
    .link-btn:nth-child(4) { animation-delay: .52s; }
    .subtitle { animation-delay: .62s; }

    .container.leaving > * { animation: fadeOutUp .7s ease forwards; }
    .container.leaving .title { animation: fadeOutUp .7s ease forwards .05s; }
    .container.leaving .link-btn:nth-child(1) { animation-delay: .1s; }
    .container.leaving .link-btn:nth-child(2) { animation-delay: .16s; }
    .container.leaving .link-btn:nth-child(3) { animation-delay: .22s; }
    .container.leaving .link-btn:nth-child(4) { animation-delay: .28s; }
    .container.leaving .links-list > .link-btn { animation: fadeOutUp .7s ease forwards; }
    .container.leaving .subtitle { animation-delay: .3s; }

    /* Аватар */
    .avatar-wrapper {
      position: relative; width: 108px; height: 108px; border-radius: 50%; padding: 3px;
      background: conic-gradient(from var(--ang, 0deg), #8a2be2, #229ED9, #5865F2, #8a2be2);
      box-shadow: 0 12px 35px rgba(0,0,0,.5);
      transition: transform .25s ease-out, box-shadow .5s ease;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      cursor: pointer; animation: spinRing 6s linear infinite;
    }
    @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    @keyframes spinRing { to { --ang: 360deg; } }
    .avatar-wrapper::before {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: inherit; filter: blur(18px); opacity: .35; z-index: -1; transition: opacity .4s;
    }
    .avatar-wrapper:hover { box-shadow: 0 20px 45px rgba(138,43,226,.4); }
    .avatar-wrapper:hover::before { opacity: .7; }
    .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #161b22; display: block; border: 3px solid #08090a; }
    .avatar-wrapper:active { transform: scale(.94); }

    .title {
      font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 26px;
      background: linear-gradient(270deg, #fff, #a3b0c2, #8a2be2, #229ED9, #fff);
      background-size: 400% 400%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: fadeInUp .9s var(--spring) .15s backwards, glowShift 8s ease infinite, floatTitle 3.5s ease-in-out infinite;
    }

    .links-list { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }

    .link-btn {
      --brand: 255,255,255;
      position: relative; width: 100%; padding: 14px 18px;
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
      color: var(--text-main); text-decoration: none; font-size: 1rem; font-weight: 500;
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 20px rgba(0,0,0,.25);
      transition: transform .4s var(--spring), background .3s, border-color .3s, box-shadow .3s;
      cursor: pointer; overflow: hidden; isolation: isolate; outline: none;
    }
    .link-btn[data-brand="telegram"] { --brand: 34,158,217; }
    .link-btn[data-brand="discord"]  { --brand: 88,101,242; }
    .link-btn[data-brand="github"]   { --brand: 240,246,252; }
    .link-btn[data-brand="steam"]    { --brand: 74,144,226; }

    .link-btn::before {
      content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .3s;
      background: radial-gradient(200px circle at var(--mx, 50%) var(--my, 50%), rgba(var(--brand), .22), transparent 70%);
    }
    .link-btn::after {
      content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
      background: rgba(255,255,255,.14); transform: rotate(30deg); transition: transform .7s ease; pointer-events: none;
    }
    .link-btn:hover, .link-btn:focus-visible {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(var(--brand), .55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 14px 32px rgba(var(--brand), .25);
    }
    .link-btn:hover::before, .link-btn:focus-visible::before { opacity: 1; }
    .link-btn:hover::after { transform: translate(520%, 0) rotate(30deg); }
    .link-btn:focus-visible { outline: 2px solid rgba(var(--brand), .8); outline-offset: 3px; }
    .link-btn:active { transform: scale(.96) !important; transition-duration: .1s; }
    .link-btn:hover .link-icon, .link-btn:focus-visible .link-icon { color: rgb(var(--brand)); transform: scale(1.15) rotate(-6deg); }
    .link-btn:hover .arrow-icon { color: var(--text-main); transform: translateX(6px) scale(1.2); }

    .link-content { display: flex; align-items: center; gap: 14px; text-align: left; }
    .link-icon { width: 26px; height: 26px; fill: currentColor; flex-shrink: 0; transition: transform .4s var(--spring), color .3s; }
    .link-text { display: flex; flex-direction: column; line-height: 1.2; }
    .link-text small { font-size: .74rem; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
    .arrow-icon { width: 18px; height: 18px; color: var(--text-muted); fill: none; stroke: currentColor; transition: transform .4s var(--spring), color .3s; }

    .ripple { position: absolute; border-radius: 50%; background: rgba(var(--brand), .35); transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none; z-index: -1; }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }

    .subtitle { font-size: .85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }

    .toast {
      position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%;
      transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
      padding: 10px 16px; border-radius: 12px; font-size: .85rem;
      background: rgba(20,22,26,.9); border: 1px solid var(--border-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: .4s var(--spring); z-index: 5;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px) scale(.9); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes fadeOutUp { from { opacity: 1; transform: none; filter: blur(0); } to { opacity: 0; transform: translateY(-40px) scale(.9); filter: blur(10px); } }
    @keyframes glowShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes floatTitle { 
      0%,100% { transform: translateY(0); filter: drop-shadow(0 0 0 rgba(138,43,226,0)); } 
      50% { transform: translateY(-3px); filter: drop-shadow(0 4px 12px rgba(138,43,226,.45)); } 
    }

    /* =========================================
       ПАСХАЛКА (Состояния разбития и сбора)
       ========================================= */
    
    /* Состояние: ВСЁ РАЗБИТО */
    .container.broken .link-btn {
      animation: shatterFall 1.2s cubic-bezier(0.6, 0.04, 0.98, 0.335) forwards;
      pointer-events: none;
    }
    .container.broken .link-btn:nth-child(1) { animation-delay: 0s; }
    .container.broken .link-btn:nth-child(2) { animation-delay: 0.05s; }
    .container.broken .link-btn:nth-child(3) { animation-delay: 0.1s; }
    .container.broken .link-btn:nth-child(4) { animation-delay: 0.15s; }
    
    .container.broken .title, .container.broken .subtitle { 
      opacity: 0; transition: opacity 0.3s; transform: translateY(20px); filter: blur(5px);
    }
    
    .container.broken .avatar-wrapper {
      animation: shatterAvatar 1s cubic-bezier(0.6, 0.04, 0.98, 0.335) forwards;
      pointer-events: none;
    }

    /* Состояние: СБОРКА */
    .container.recovering .link-btn {
      animation: riseUp 1s var(--spring) forwards;
      pointer-events: auto;
    }
    .container.recovering .link-btn:nth-child(4) { animation-delay: 0s; }
    .container.recovering .link-btn:nth-child(3) { animation-delay: 0.1s; }
    .container.recovering .link-btn:nth-child(2) { animation-delay: 0.2s; }
    .container.recovering .link-btn:nth-child(1) { animation-delay: 0.3s; }
    
    .container.recovering .title, .container.recovering .subtitle { 
      opacity: 1; transition: opacity 0.5s 0.5s; transform: translateY(0); filter: blur(0);
    }
    
    .container.recovering .avatar-wrapper {
      animation: reassembleAvatar 1.2s var(--spring) forwards;
    }

    @keyframes shatterFall {
      0% { transform: translateY(0) rotate(0); opacity: 1; filter: blur(0); }
      15% { transform: translateY(-20px) rotate(-5deg) scale(0.95); opacity: 1; }
      100% { transform: translateY(100vh) rotate(45deg) scale(0.5); opacity: 0; filter: blur(10px); }
    }

    @keyframes riseUp {
      0% { transform: translateY(100vh) rotate(45deg) scale(0.5); opacity: 0; filter: blur(10px); }
      100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; filter: blur(0); }
    }

    @keyframes shatterAvatar {
      0% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
      50% { transform: scale(0.8) rotate(180deg); opacity: 0.5; filter: blur(5px); }
      100% { transform: scale(0) rotate(360deg); opacity: 0; filter: blur(20px); }
    }

    @keyframes reassembleAvatar {
      0% { transform: scale(0) rotate(-360deg); opacity: 0; filter: blur(10px); }
      100% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .blob { display: none; }
    }
  </style>
</head>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const container = $('#container');
    const canvas = $('#particles');
    const ctx = canvas.getContext('2d');
    const root = document.documentElement;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Аватар: запасные варианты ---------- */
    const img = $('#tg-avatar');
    let fb = 0;
    img.onerror = () => {
      if (fb++ === 0) { img.src = 'https://github.com/vexx-77.png'; return; }
      img.onerror = null;
      img.src = "data:image/svg+xml," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#161b22'/><text x='50' y='66' font-size='52' font-weight='700' text-anchor='middle' fill='#8a2be2' font-family='sans-serif'>V</text></svg>");
    };

    /* ---------- Toast ---------- */
    const toast = $('#toast'); let tt;
    const say = msg => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1800); };

    /* ---------- Указатель (Курсор/Тач) ---------- */
    const mouse = { x: -9999, y: -9999, active: false };
    const handlePointer = (e) => {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      root.style.setProperty('--px', (e.clientX / innerWidth - .5).toFixed(3));
      root.style.setProperty('--py', (e.clientY / innerHeight - .5).toFixed(3));
    };
    addEventListener('pointermove', handlePointer, { passive: true });
    addEventListener('pointerleave', () => { mouse.active = false; });
    addEventListener('pointerup', e => { if (e.pointerType === 'touch') mouse.active = false; });

    /* ---------- Глобальные переменные для пасхалки ---------- */
    let isEggActive = false;
    let eggClicks = 0;
    let eggTimer = null;
    
    // Управление яркостью фона
    let globalAlpha = 1; 
    let particleFlash = 1;

    /* ---------- Частицы ---------- */
    let W, H, dpr, particles = [], sparks = [];
    let leaving = false, lineOpacity = 1, running = true;
    const MAXD = 130;
    const MAXD_SQ = MAXD * MAXD;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const want = Math.round(Math.min(90, Math.max(35, (W * H) / 16000)));
      while (particles.length < want) particles.push(new P(true));
      particles.length = want;
    }

    class P {
      constructor(init) { this.reset(init); }
      reset(init) {
        this.x = Math.random() * W; this.y = init ? Math.random() * H : H + 10;
        this.s = Math.random() * 1.8 + .6;
        this.vx = (Math.random() - .5) * .6;
        this.vy = (Math.random() - .5) * .6;
        this.ta = Math.random() * .5 + .15; this.a = init ? this.ta : 0;
        this.ex = (Math.random() - .5) * 5; this.ey = -(Math.random() * 3 + 1.5);
        this.hue = Math.random() < .25 ? 270 : (Math.random() < .3 ? 200 : 0);
      }
      update() {
        if (leaving) { this.x += this.ex; this.y += this.ey; this.a *= .96; return; }
        if (this.a < this.ta) this.a += .01;
        if (mouse.active) {
          const dx = this.x - mouse.x, dy = this.y - mouse.y, d2 = dx * dx + dy * dy;
          if (d2 < 22500 && d2 > 1) { 
            const d = Math.sqrt(d2), f = (150 - d) / 150 * .9; 
            this.vx += dx / d * f * .12; this.vy += dy / d * f * .12; 
          }
        }
        this.vx *= .998; this.vy *= .998;
        this.vx += (Math.random() - .5) * .025; this.vy += (Math.random() - .5) * .025;
        this.x += this.vx; this.y += this.vy;
        if (this.x < -10) this.x = W + 10; else if (this.x > W + 10) this.x = -10;
        if (this.y < -10) this.y = H + 10; else if (this.y > H + 10) this.y = -10;
      }
      draw() {
        if (this.a <= .01) return;
        const finalA = Math.min(1, this.a * globalAlpha * particleFlash); // Учитываем вспышку
        if (finalA <= 0) return;
        ctx.fillStyle = this.hue ? `hsla(${this.hue},80%,70%,${finalA})` : `rgba(255,255,255,${finalA})`;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, 6.2832); ctx.fill();
      }
    }

    function burst(x, y, count = 40) {
      if (reduce) return;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * 6.2832, v = Math.random() * 5 + 1.5;
        sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, h: [270, 200, 235, 320][i % 4], isImploding: false });
      }
    }

    function implode(x, y) {
      if (reduce) return;
      for (let i = 0; i < 60; i++) {
        const a = Math.random() * 6.2832, dist = 100 + Math.random() * 200;
        sparks.push({ 
          x: x + Math.cos(a) * dist, 
          y: y + Math.sin(a) * dist, 
          vx: 0, vy: 0, 
          tx: x, ty: y, 
          life: 1, h: 270, isImploding: true 
        });
      }
    }

    function frame() {
      if (!running) return;
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => p.update());

      lineOpacity = Math.max(0, Math.min(1, lineOpacity + (leaving ? -.05 : .02)));
      if (lineOpacity > 0 && globalAlpha > 0) {
        ctx.lineWidth = .6;
        const currentLineAlpha = lineOpacity * globalAlpha * particleFlash;
        for (let i = 0; i < particles.length; i++) {
          const a = particles[i];
          for (let j = i + 1; j < particles.length; j++) {
            const b = particles[j], dx = a.x - b.x, dy = a.y - b.y;
            if (Math.abs(dx) > MAXD || Math.abs(dy) > MAXD) continue;
            const d2 = dx * dx + dy * dy;
            if (d2 < MAXD_SQ) {
              const al = Math.min(1, (1 - Math.sqrt(d2) / MAXD) * .2 * currentLineAlpha);
              ctx.strokeStyle = `rgba(255,255,255,${al})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
          if (mouse.active && !leaving && globalAlpha > 0) {
            const dx = a.x - mouse.x, dy = a.y - mouse.y;
            const d2_m = dx * dx + dy * dy; 
            if (d2_m < 28900) { 
              const al = Math.min(1, (1 - Math.sqrt(d2_m) / 170) * .35 * currentLineAlpha);
              ctx.strokeStyle = `rgba(160,110,255,${al})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
            }
          }
        }
      }
      particles.forEach(p => p.draw());

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        if (s.isImploding) {
          const dx = s.tx - s.x, dy = s.ty - s.y;
          s.x += dx * 0.08;
          s.y += dy * 0.08;
          s.life -= 0.02;
          if (s.life <= 0 || (Math.abs(dx) < 5 && Math.abs(dy) < 5)) { sparks.splice(i, 1); continue; }
        } else {
          s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy = s.vy * .96 + .08; s.life -= .018;
          if (s.life <= 0) { sparks.splice(i, 1); continue; }
        }
        ctx.fillStyle = `hsla(${s.h},90%,70%,${s.life})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, 2 * s.life + .5, 0, 6.2832); ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    let resizeTimeout;
    addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resize, 150);
    });
    document.addEventListener('visibilitychange', () => {
      running = !document.hidden;
      if (running) requestAnimationFrame(frame);
    });
    
    resize();
    if (!reduce) requestAnimationFrame(frame); else { running = false; particles.forEach(p => p.draw()); }

    /* ---------- Аватар: 3D-наклон + Логика пасхалки ---------- */
    const av = $('#avatar');
    const wrap = av.parentElement;
    
    wrap.addEventListener('pointermove', e => {
      if (isEggActive) return;
      const r = av.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      av.style.setProperty('--ry', (x * 28) + 'deg');
      av.style.setProperty('--rx', (-y * 28) + 'deg');
    }, { passive: true });
    
    wrap.addEventListener('pointerleave', () => { 
      av.style.setProperty('--rx', '0deg'); 
      av.style.setProperty('--ry', '0deg'); 
    });
    
    av.addEventListener('click', e => {
      if (isEggActive) return;
      
      const r = av.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      
      // Обычный клик (искры)
      burst(cx, cy, 15); 

      // Счетчик пасхалки
      eggClicks++;
      clearTimeout(eggTimer);
      eggTimer = setTimeout(() => { eggClicks = 0; }, 1500); // Сброс, если не успел накликать

      if (eggClicks >= 10) {
        triggerEasterEgg(cx, cy);
        eggClicks = 0;
      }
    });

    /* ---------- Сценарий пасхалки ---------- */
    function triggerEasterEgg(cx, cy) {
      isEggActive = true;
      
      // 1. Ломаем интерфейс
      container.classList.add('broken');
      
      // 2. Взрыв аватарки
      burst(cx, cy, 80);

      // 3. Плавно гасим звезды на фоне
      const fadeOutStars = setInterval(() => {
        globalAlpha -= 0.05;
        if (globalAlpha <= 0) {
          globalAlpha = 0;
          clearInterval(fadeOutStars);
        }
      }, 30);

      // 4. Ждем 5 секунд и начинаем сборку
      setTimeout(() => {
        recoverEgg(cx, cy);
      }, 5000);
    }

    function recoverEgg(cx, cy) {
      container.classList.remove('broken');
      container.classList.add('recovering');

      // 1. Звезды появляются и ВСПЫХИВАЮТ (particleFlash = 3)
      globalAlpha = 0;
      particleFlash = 3; 

      const fadeInStars = setInterval(() => {
        globalAlpha += 0.05;
        if (globalAlpha >= 1) {
          globalAlpha = 1;
          clearInterval(fadeInStars);

          // Через 1 секунду яркость возвращается в норму
          setTimeout(() => {
            const dimFlash = setInterval(() => {
              particleFlash -= 0.05;
              if (particleFlash <= 1) {
                particleFlash = 1;
                clearInterval(dimFlash);
              }
            }, 30);
          }, 1000);
        }
      }, 20);

      // 2. Аватарка собирается из частиц (вызываем имплозию)
      implode(cx, cy);

      // 3. Конец пасхалки (через 1.5 сек кнопки уже прилетят)
      setTimeout(() => {
        container.classList.remove('recovering');
        isEggActive = false;
      }, 1500);
    }

    /* ---------- Кнопки: прожектор + ripple + уход ---------- */
    const btns = document.querySelectorAll('.link-btn');
    btns.forEach(btn => {
      btn.addEventListener('pointermove', e => {
        if (isEggActive) return;
        const r = btn.getBoundingClientRect();
        btn.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        btn.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }, { passive: true });

      btn.addEventListener('click', e => {
        e.preventDefault();
        if (isEggActive) return;
        if (container.classList.contains('leaving')) return;

        const r = btn.getBoundingClientRect();
        const size = Math.max(r.width, r.height) * 2;
        const rp = document.createElement('span');
        rp.className = 'ripple';
        rp.style.cssText = `width:${size}px;height:${size}px;left:${(e.clientX || r.left + r.width / 2) - r.left - size / 2}px;top:${(e.clientY || r.top + r.height / 2) - r.top - size / 2}px`;
        btn.appendChild(rp);
        setTimeout(() => rp.remove(), 700);

        const href = btn.href;
        container.classList.add('leaving');
        container.style.pointerEvents = 'none';
        leaving = true;

        setTimeout(() => {
          const w = window.open(href, '_blank', 'noopener');
          if (!w) { location.href = href; return; }
          comeBack();
        }, 800);
      });
    });

    function comeBack() {
      container.classList.remove('leaving');
      container.style.pointerEvents = '';
      leaving = false;
      particles.forEach(p => p.reset(true));
    }
    // Возврат из кеша браузера (кнопка «назад»)
    addEventListener('pageshow', e => { if (e.persisted) comeBack(); });

  })();
  </script>
</body>
</html>
